# Dependabot tracks Playwright, so the e2e suites move to each new Chromium
# build, and the SHA-pinned GitHub Actions. Upgrade PRs are merged by hand.
# Security updates for every other dependency are unaffected by `allow`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '04:00'
    allow:
      - dependency-name: '@playwright/test'
      - dependency-name: 'playwright'
    # Skip releases younger than 3 days. pnpm 11 refuses packages younger than
    # 1 day (`minimumReleaseAge`), so the lockfile update always resolves.
    cooldown:
      default-days: 3
    groups:
      playwright:
        patterns: ['@playwright/test', 'playwright', 'playwright-core']
    commit-message:
      prefix: 'chore(e2e)'
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '04:00'
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
    open-pull-requests-limit: 2
