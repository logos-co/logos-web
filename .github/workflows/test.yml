name: Test

on:
  pull_request:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: logos_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d logos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/logos_test
      CMS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/logos_test
      DEPLOYMENT_VERSION: ci
      # Use the committed circles snapshot if Hasura is unreachable.
      ALLOW_ACTIVE_CIRCLES_FETCH_FAILURE: '1'
      # Exercise the media export with committed data and images in CI.
      PRESS_CONTENT_SNAPSHOT: ${{ github.workspace }}/apps/web/lib/data/press.snapshot.json
      PRESS_MEDIA_IMAGE_FIXTURES_DIR: ${{ github.workspace }}/apps/web/test/fixtures/press-images
      NEXT_PUBLIC_API_MODE: production
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      PAYLOAD_SECRET: test-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: CI=true pnpm install --frozen-lockfile
      - run: pnpm test:release
        env:
          # Authenticates build-time GitHub API calls (RFP markdown is fetched from
          # logos-co/rfp during `next build`). Unauthenticated requests share a
          # 60 req/hr-per-IP limit across runners and intermittently 403, which fails
          # the static export. The Actions-provided token lifts this to 1,000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
