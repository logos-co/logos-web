# Pilot version — everything self-contained in this repo. Review-only, no auto-fix.
# Trigger: comment "/ai-review" on any PR. Workflow file must be on the default branch.

name: AI PR Review (pilot)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ai-review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acknowledge trigger (eyes reaction)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes || true

      # Security: check out the DEFAULT branch, never the PR head. The reviewer
      # program (scripts/ai-review/review.mjs), the config (.github/ai-review.yml)
      # and the guideline files all run/read from trusted code here. The PR's diff
      # is fetched separately via the GitHub API by PR number (see review.mjs), so
      # a malicious PR cannot inject code or config into this job's token/secrets.
      - name: Checkout default branch (trusted reviewer code + config)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dual review + synthesis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/ai-review/review.mjs
