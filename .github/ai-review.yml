# Repo-specific tuning for the shared reviewer (acid-info/ai-review).
# Models, severity threshold and diff budget are owned centrally -- change them there.
extra_ignore:
  - 'flake.lock'
  - 'packages/types/src/payload.ts'
  - 'apps/cms/src/app/(payload)/admin/importMap.js'
  - 'apps/cms/src/migrations/*.json'
guidelines_files:
  - AGENTS.md
  - REVIEW.md
  - CLAUDE.md
