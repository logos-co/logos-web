# Repo-specific tuning for the shared docs sync (acid-info/ai-tools, tools/ai-docs-sync).
# Read from the target branch (develop).
doc_paths:
  - README.md
  - AGENTS.md
  - docs/**/*.md
  - apps/*/README.md
  - apps/*/AGENTS.md
  - apps/*/docs/**/*.md
  - packages/*/README.md
  - packages/*/AGENTS.md
  - packages/*/docs/**/*.md

never_touch:
  # dated research records, not maintained docs
  - apps/*/docs/research/**

extra_ignore:
  - 'flake.lock'
  - 'packages/types/src/payload.ts'
  - 'apps/cms/src/app/(payload)/admin/importMap.js'
  - 'apps/cms/src/migrations/*.json'

guidelines_files:
  - AGENTS.md

# Members of @logos-co/web, by login: the Actions token cannot read org teams, so a team request
# fails with a 422. Keep in sync with the team.
reviewers:
  - '@jinhojang6'
  - '@JulesFiliot'
